services:
  broker:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - paperless-redis:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "127.0.0.1:${PAPERLESS_PORT:-8010}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: http://localhost:${PAPERLESS_PORT:-8010}
      PAPERLESS_TIME_ZONE: Africa/Casablanca
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-admin@revisionos.local}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_OCR_LANGUAGES: ara fra eng
      PAPERLESS_OCR_LANGUAGE: fra+ara+eng
      PAPERLESS_FILENAME_FORMAT: "{document_type}/{title}"
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
      PAPERLESS_APP_TITLE: "RevisionOS Documents"
      PAPERLESS_WEBSERVER_WORKERS: "1"
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      PAPERLESS_AI_LLM_ENDPOINT: http://host.docker.internal:11434
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: fr
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
      USERMAP_UID: ${USERMAP_UID:-1000}
      USERMAP_GID: ${USERMAP_GID:-1000}
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-redis:
