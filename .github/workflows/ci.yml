name: RevisionOS CI
on:
  push:
    branches: [revisionos-v1]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer shell syntax
        run: |
          bash -n start-revisionos.sh
          bash -n scripts/setup-document-stack.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example
          SUPABASE_SERVICE_ROLE_KEY: example
          AI_PROVIDER: ollama
          PAPERLESS_URL: http://127.0.0.1:8010
          JOPLIN_BASE_URL: http://127.0.0.1:41184
